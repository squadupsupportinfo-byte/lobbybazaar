<!doctype html>
<html lang="en" dir="ltr" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>LobbyBazaar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Connect gamers and assemble squads on a glowing sketch outline radar map." />
    <meta property="og:title" content="LobbyBazaar" />
    <meta property="og:description" content="Connect gamers and assemble squads on a glowing sketch outline radar map." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="notranslate bg-[#05070a] text-slate-100 antialiased overflow-x-hidden selection:bg-emerald-500/30 selection:text-emerald-200" dir="ltr" translate="no">
    <!-- Global SVG Filter for genuine hand-drawn sketch lines -->
    <svg class="pointer-events-none fixed -top-[9999px] -left-[9999px] w-0 h-0" aria-hidden="true">
      <defs>
        <filter id="sketch-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feMerge>
            <feMergeNode in="displaced" />
          </feMerge>
        </filter>
        <filter id="sketch-heavy" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feMerge>
            <feMergeNode in="displaced" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
